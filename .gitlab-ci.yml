default:
  image: espressif/idf:release-v5.5
  interruptible: true

stages:
  - build
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTEST_ADDOPTS: "-ra"

cache:
  paths:
    - .cache/pip

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build_firmware:
  stage: build
  script:
    - idf.py set-target esp32c6
    - idf.py build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/
      - sdkconfig

integration_tests:
  stage: test
  needs:
    - job: build_firmware
      artifacts: true
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r tests/requirements.txt
  script:
    - pytest tests/integration/test_build_artifacts.py -v --junitxml=tests/integration/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: tests/integration/junit.xml
    paths:
      - tests/integration/junit.xml
