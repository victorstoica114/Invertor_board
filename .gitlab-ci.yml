default:
  image:
    name: espressif/idf:v6.0.1
    entrypoint: [""]
  tags:
    - ubuntu
  interruptible: true

stages:
  - sanity
  - unit
  - integration
  - build

variables:
  IDF_CCACHE_ENABLE: "1"
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTEST_ADDOPTS: "-ra"

cache:
  paths:
    - .cache/pip
    - .ccache

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.esp_idf_python_before_script: &esp_idf_python_before_script
  - |
    if [ -f /opt/esp/idf/export.sh ]; then
      . /opt/esp/idf/export.sh
    elif [ -n "${IDF_PATH:-}" ] && [ -f "$IDF_PATH/export.sh" ]; then
      . "$IDF_PATH/export.sh"
    else
      echo "ESP-IDF export.sh not found. Set IDF_PATH or use the ESP-IDF Docker image."
      exit 1
    fi
  - python -m pip install -r tests/requirements.txt

sanity_tests:
  stage: sanity
  before_script: *esp_idf_python_before_script
  script:
    - pytest tests/sanity -v --junitxml=tests/sanity/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: tests/sanity/junit.xml
    paths:
      - tests/sanity/junit.xml

unit_tests:
  stage: unit
  before_script: *esp_idf_python_before_script
  script:
    - pytest tests/unit/test_host_unit_coverage.py -v --junitxml=tests/unit/junit.xml
    - mkdir -p tests/.build/host_unit/coverage/html
    - python -m gcovr --root . --object-directory tests/.build/host_unit --filter main --filter tests/unit --xml-pretty --output tests/.build/host_unit/coverage/cobertura.xml --html-details tests/.build/host_unit/coverage/html/index.html --print-summary
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: tests/unit/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: tests/.build/host_unit/coverage/cobertura.xml
    paths:
      - tests/unit/junit.xml
      - tests/.build/host_unit/coverage/

build_firmware:
  stage: build
  before_script: *esp_idf_python_before_script
  script:
    - idf.py --version
    - idf.py set-target esp32c6
    - idf.py build
    - pytest tests/firmware_build -v --junitxml=tests/firmware_build/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: tests/firmware_build/junit.xml
    paths:
      - tests/firmware_build/junit.xml
      - build/
      - sdkconfig

integration_tests:
  stage: integration
  before_script: *esp_idf_python_before_script
  script:
    - pytest tests/integration -v --junitxml=tests/integration/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: tests/integration/junit.xml
    paths:
      - tests/integration/junit.xml
